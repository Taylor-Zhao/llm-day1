# 按客户端 IP 限制突发请求，外层 API Gateway 仍应执行用户级限流。
limit_req_zone $binary_remote_addr zone=labeling_api:10m rate=20r/s;

# 定义单个静态站点和 API 反向代理。
server {
    # 在非特权 8080 端口监听 IPv4。
    listen 8080;
    # 在非特权 8080 端口监听 IPv6。
    listen [::]:8080;
    # 接受编排平台传入的任意主机名。
    server_name _;
    # 指定 Vue 生产构建目录。
    root /usr/share/nginx/html;
    # 指定 SPA 入口文件。
    index index.html;
    # 限制题目与标签请求体大小。
    client_max_body_size 1m;

    # 防止 MIME 类型嗅探。
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止第三方页面嵌入补录系统。
    add_header X-Frame-Options "DENY" always;
    # 限制浏览器 Referrer 泄露。
    add_header Referrer-Policy "no-referrer" always;
    # 仅允许本站脚本、样式、图片和 API 连接。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 将版本化业务 API 转发到 FastAPI Service。
    location /api/ {
        # 应用客户端级限流并允许小幅突发。
        limit_req zone=labeling_api burst=40 nodelay;
        # 保留完整 API 路径转发给后端。
        proxy_pass http://api:8010;
        # 使用 HTTP/1.1 支持 keep-alive。
        proxy_http_version 1.1;
        # 传递原始 Host。
        proxy_set_header Host $host;
        # 传递客户端 IP 链。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 传递外层协议。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传或生成请求追踪 ID。
        proxy_set_header X-Request-ID $request_id;
        # 限制后端连接建立时间。
        proxy_connect_timeout 5s;
        # 允许复杂模型预测最多等待 60 秒。
        proxy_read_timeout 60s;
    }

    # 将就绪探针转发到 API。
    location = /readyz {
        # 转发到 FastAPI 就绪端点。
        proxy_pass http://api:8010/readyz;
    }

    # 其他路径由 Vue Router/SPA 入口处理。
    location / {
        # 优先返回静态文件，不存在时回退 index.html。
        try_files $uri $uri/ /index.html;
    }
}
