# 按客户端 IP 限制突发请求；外层网关仍应执行用户级限流。
limit_req_zone $binary_remote_addr zone=react_labeling_api:10m rate=20r/s;

# 定义 React 静态站点与 FastAPI 反向代理。
server {
    # 使用容器内非特权端口。
    listen 8080;
    # 同时监听 IPv6。
    listen [::]:8080;
    # 接收部署平台传入的主机名。
    server_name _;
    # 指定 Vite 生产产物目录。
    root /usr/share/nginx/html;
    # 指定 SPA 入口。
    index index.html;
    # 限制题目和标签请求体大小。
    client_max_body_size 1m;

    # 禁止 MIME 类型嗅探。
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止第三方页面嵌入内部补录系统。
    add_header X-Frame-Options "DENY" always;
    # 限制 Referrer 信息外泄。
    add_header Referrer-Policy "no-referrer" always;
    # React 产物无需 inline script，因此可以使用严格 CSP。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 将业务 API 转发给同一 FastAPI 服务。
    location /api/ {
        # 应用客户端级请求速率限制。
        limit_req zone=react_labeling_api burst=40 nodelay;
        # 保留完整路径转发。
        proxy_pass http://api:8010;
        # 使用 keep-alive 连接。
        proxy_http_version 1.1;
        # 传递原始主机名。
        proxy_set_header Host $host;
        # 传递客户端 IP 链。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 传递外层协议。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 为审计和排错透传请求 ID。
        proxy_set_header X-Request-ID $request_id;
        # 限制连接建立时间。
        proxy_connect_timeout 5s;
        # 允许复杂模型预测最多等待六十秒。
        proxy_read_timeout 60s;
    }

    # 将就绪探针转发到 FastAPI。
    location = /readyz {
        # 代理后端就绪检查。
        proxy_pass http://api:8010/readyz;
    }

    # React 是客户端渲染 SPA，未知路径回退入口文件。
    location / {
        # 优先返回真实静态文件，否则返回 index.html。
        try_files $uri $uri/ /index.html;
    }
}
