# Alembic 主配置；数据库 URL 由 migrations/env.py 从 DATABASE_URL 注入。
[alembic]
# 指定迁移脚本目录。
script_location = migrations
# 将项目根目录加入 Python 导入路径。
prepend_sys_path = .

# 配置标准日志，生产环境可由进程管理器覆盖。
[loggers]
# 声明 root、sqlalchemy 和 alembic 日志器。
keys = root,sqlalchemy,alembic

# 声明控制台输出处理器。
[handlers]
# 仅使用 stderr 控制台处理器。
keys = console

# 声明通用日志格式。
[formatters]
# 使用 generic 格式器。
keys = generic

# root 默认输出警告以上日志。
[logger_root]
# 设置日志级别。
level = WARN
# 绑定控制台处理器。
handlers = console
# 留空 qualname 表示根日志器。
qualname =

# SQLAlchemy SQL 日志默认关闭，避免泄露题目和连接信息。
[logger_sqlalchemy]
# 仅输出警告。
level = WARN
# 绑定控制台处理器。
handlers = console
# 指定 SQLAlchemy engine 日志命名空间。
qualname = sqlalchemy.engine
# 禁止向 root 重复传播。
propagate = 0

# Alembic 迁移事件输出信息级别。
[logger_alembic]
# 输出迁移版本信息。
level = INFO
# 绑定控制台处理器。
handlers = console
# 指定 Alembic 日志命名空间。
qualname = alembic
# 禁止重复传播。
propagate = 0

# 控制台处理器写到 stderr。
[handler_console]
# 使用标准 StreamHandler。
class = StreamHandler
# 接收未过滤日志。
args = (sys.stderr,)
# 不额外抬高日志级别。
level = NOTSET
# 使用通用格式。
formatter = generic

# 定义紧凑日志格式。
[formatter_generic]
# 输出级别、名称和消息。
format = %(levelname)-5.5s [%(name)s] %(message)s
# 使用横杠分隔时间。
datefmt = %H:%M:%S
